// Gradle     Latest : https://gradle.org/releases/
// Spotless   Latest : https://plugins.gradle.org/plugin/com.diffplug.spotless
// Curseforge Latest : https://plugins.gradle.org/plugin/com.matthewprenger.cursegradle
// Modrinth   Latest : https://plugins.gradle.org/plugin/com.modrinth.minotaur
// Dokka      Latest : https://plugins.gradle.org/plugin/org.jetbrains.dokka

plugins {
    id 'net.fabricmc.fabric-loom'
    id 'maven-publish'
    id 'eclipse'
    id 'com.diffplug.spotless'
    id 'com.matthewprenger.cursegradle'
    id 'com.modrinth.minotaur'
    id 'org.jetbrains.dokka' version "${dokka_version}"
}

apply from: 'gradle/base/javaDocs.gradle'
apply from: 'gradle/base/import-properties.gradle'
apply from: 'gradle/base/log-changes.gradle'

version = modVersion
group = "com.dynamero.jilibs"

apply from: 'gradle/base/git-versioning.gradle'
apply from: 'gradle/base/loom-fab.gradle'
apply from: 'gradle/base/repositories.gradle'
apply from: 'gradle/dependencies.gradle'
apply from: 'gradle/base/process-resources.gradle'

apply from: 'gradle/base/spotless.gradle'
apply from: 'gradle/base/tasks-java-jar.gradle'
apply from: 'gradle/base/tasks-custom.gradle'
apply from: 'gradle/publishing/modrinth-publication.gradle'
apply from: 'gradle/publishing/curseforge-publication.gradle'
apply from: 'gradle/base/tasks-organize.gradle'
apply from: 'gradle/publishing/maven-publication.gradle'