name: Deploy Javadoc

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the mod repo
      - name: Checkout Mod Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Checkout the shared config inside the workspace
      - name: Checkout Shared Config
        uses: actions/checkout@v4
        with:
          repository: 'drkhodakarami/Minecraft-Shared-Config'
          path: '.shared-config'

      # Step 3: Move it to the parent directory where settings.gradle expects it
      - name: Position Shared Config in Parent Directory
        run: |
          mv .shared-config-temp ../shared-config
          # token: ${{ secrets.CONFIG_REPO_PAT }} # Uncomment if Minecraft-Shared-Config is a private repo

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Javadoc
        run: ./gradlew javadoc --no-daemon

      - name: Prevent Jekyll Processing
        run: |
          mkdir -p build/docs/javadoc
          touch build/docs/javadoc/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/docs/javadoc'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4