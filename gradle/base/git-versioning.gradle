def modVer = project.ext.modVersion

def getCommitCount = { ->
    try {
        def count = project.providers.exec {
            workingDir = project.rootDir
            commandLine 'git', 'rev-list', '--count', 'HEAD'
        }.standardOutput.asText.get().trim()
        return count
    } catch (Exception e) {
        println ">>> GIT COUNT FAILED: ${e.message}"
        e.printStackTrace()
        return "0"
    }
}

// Let's say that we set the mod version to 26.2.1
// If HEAD has 42 commits, version becomes "26.2.1.42"
version = "${modVer}.${getCommitCount()}"